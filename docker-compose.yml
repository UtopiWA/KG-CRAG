name: kg-crag

services:
  api:
    profiles: ["replay", "app", "full"]
    build:
      context: .
    command: ["kg-crag-api"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      KG_CRAG_API_HOST: 0.0.0.0
      KG_CRAG_REPLAY_FIXTURE_PATH: src/kg_crag/application/replay_cases.json
      KG_CRAG_ENABLE_LIVE_QUERY: "${KG_CRAG_ENABLE_LIVE_QUERY:-false}"
    ports:
      - "${KG_CRAG_API_PORT:-8000}:8000"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  ui:
    profiles: ["replay", "app", "full"]
    build:
      context: .
    command: ["kg-crag-ui"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      KG_CRAG_UI_API_BASE_URL: http://api:8000
      KG_CRAG_UI_HOST: 0.0.0.0
      KG_CRAG_UI_PORT: 7860
    ports:
      - "${KG_CRAG_UI_PORT:-7860}:7860"
    mem_limit: 1g
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    profiles: ["stores", "full"]
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - "${KG_CRAG_QDRANT_DATA_PATH:-./.docker-data/qdrant}:/qdrant/storage"
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    profiles: ["graph", "full"]
    image: neo4j:5.26.2-community
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${KG_CRAG_NEO4J_PASSWORD:-change-me-before-use}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - "${KG_CRAG_NEO4J_DATA_PATH:-./.docker-data/neo4j/data}:/data"
      - "${KG_CRAG_NEO4J_LOG_PATH:-./.docker-data/neo4j/logs}:/logs"
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
