dense_embedding:
  provider: sentence-transformers
  model: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  dimensions: 1024
  normalization: nfc-strip-v1
  batch_size: 16
  max_batch_size: 64
  normalize: true
  query_prefix: "Represent this sentence for searching relevant passages: "
  document_prefix: ""
  cache_root: data/processed/embedding-cache

vector_collection:
  prefix: kg_crag_dense
  schema_version: v1
  distance: cosine
  allowed_filters:
    - paper_id
    - section
    - processing_version

indexing:
  max_papers: 200
  upsert_batch_size: 64
  manifest_root: data/processed/index-runs

dense:
  top_k: 20
  max_top_k: 100
  deduplicate_by_paper: false
  candidate_multiplier: 3
  max_candidates: 100
  min_score: 0.0

generation:
  prompt_path: prompts/dense-rag-v1.txt
  max_evidence: 8
  max_chars_per_evidence: 4000
  max_context_chars: 20000
  max_response_chars: 20000
  min_evidence: 1
  min_score: 0.0
  output_root: data/processed/query-runs

sparse:
  schema_version: v1
  tokenizer: scientific-unicode-v1
  bm25_version: sqlite-fts5-bm25-v1
  index_root: data/processed/sparse-index
  manifest_root: data/processed/sparse-index-runs
  top_k: 20
  max_top_k: 100
  max_candidates: 100
  max_query_chars: 2000
  max_query_tokens: 64
  allowed_filters:
    - paper_id
    - section
    - processing_version

graph:
  schema_config:
    schema_version: v1
    metadata_builder_version: metadata-v1
    selector_version: representative-v1
    extractor_version: structured-v1
    prompt_version: graph-extraction-v1
    normalization_version: conservative-v1
    query_template_version: v1
    model_revision: configured
  paths:
    manifest_root: data/processed/graph-runs
    cache_root: data/processed/graph-extraction-cache
    review_root: data/processed/graph-review
    review_decisions: data/processed/graph-review/decisions.json
    prompt_path: prompts/graph-extraction-v1.txt
    evaluation_questions: data/evaluation/graph_dev_questions.json
    evaluation_results_root: data/evaluation/results/graph-retrieval
  selection:
    min_chunks_per_paper: 3
    max_chunks_per_paper: 5
    min_chunk_chars: 200
    max_chunk_chars: 8000
    max_papers: 15
  extraction:
    enabled: false
    max_requests: 100
    max_input_tokens: 160000
    max_output_tokens: 40000
    max_output_chars: 16000
    batch_size: 1
    concurrency: 1
    chars_per_token_estimate: 3
  normalization:
    auto_merge_min_confidence: 0.9
    review_similarity_threshold: 0.8
  query:
    top_k: 20
    max_top_k: 100
    max_candidates: 100
    max_hops: 3
    timeout_seconds: 10
    min_confidence: 0.0

fusion:
  method: rrf
  normalization: min-max-v1
  rrf_k: 60
  dense_weight: 0.5
  sparse_weight: 0.5
  final_top_k: 10

reranker:
  enabled: true
  model: BAAI/bge-reranker-base
  revision: 2cfc18c9415c912f9d8155881c133215df768a70
  device: cpu
  cache_root: data/processed/model-cache
  batch_size: 8
  max_batch_size: 16
  max_candidates: 20
  top_k: 8

hybrid:
  allow_partial: true
  allow_rerank_fallback: true
  deduplicate_by_paper: false
  max_output: 8
  output_root: data/processed/hybrid-query-runs
