dense_embedding:
  provider: sentence-transformers
  model: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  dimensions: 1024
  normalization: nfc-strip-v1
  batch_size: 16
  max_batch_size: 64
  normalize: true
  query_prefix: "Represent this sentence for searching relevant passages: "
  document_prefix: ""
  cache_root: data/processed/embedding-cache

vector_collection:
  prefix: kg_crag_dense
  schema_version: v1
  distance: cosine
  allowed_filters:
    - paper_id
    - section
    - processing_version

indexing:
  max_papers: 200
  upsert_batch_size: 64
  manifest_root: data/processed/index-runs

dense:
  top_k: 20
  max_top_k: 100
  deduplicate_by_paper: false
  candidate_multiplier: 3
  max_candidates: 100
  min_score: 0.0

generation:
  prompt_path: prompts/dense-rag-v1.txt
  max_evidence: 8
  max_chars_per_evidence: 4000
  max_context_chars: 20000
  max_response_chars: 20000
  min_evidence: 1
  min_score: 0.0
  output_root: data/processed/query-runs

sparse:
  schema_version: v1
  tokenizer: scientific-unicode-v1
  bm25_version: sqlite-fts5-bm25-v1
  index_root: data/processed/sparse-index
  manifest_root: data/processed/sparse-index-runs
  top_k: 20
  max_top_k: 100
  max_candidates: 100
  max_query_chars: 2000
  max_query_tokens: 64
  allowed_filters:
    - paper_id
    - section
    - processing_version

graph:
  top_k: 20
  max_hops: 3
  query_timeout_seconds: 10

fusion:
  method: rrf
  normalization: min-max-v1
  rrf_k: 60
  dense_weight: 0.5
  sparse_weight: 0.5
  final_top_k: 10

reranker:
  enabled: true
  model: BAAI/bge-reranker-base
  revision: 2cfc18c9415c912f9d8155881c133215df768a70
  device: cpu
  cache_root: data/processed/model-cache
  batch_size: 8
  max_batch_size: 16
  max_candidates: 20
  top_k: 8

hybrid:
  allow_partial: true
  allow_rerank_fallback: true
  deduplicate_by_paper: false
  max_output: 8
  output_root: data/processed/hybrid-query-runs
