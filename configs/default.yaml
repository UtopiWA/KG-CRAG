project:
  name: kg-crag
  random_seed: 42
  ingestion_version: v1

api:
  host: 0.0.0.0
  port: 8000

workflow:
  max_internal_retrieval_rounds: 2
  max_web_retrieval_rounds: 1
  max_reflection_rounds: 1
  enable_web_fallback: false

corrective_workflow:
  schema_version: v1
  policy_version: policy-v1
  initial_strategy: facet_corrective
  facets:
    version: facet-rules-v3
    prompt_version: facet-prompt-v2
    prompt_path: prompts/facet-requirements-v2.txt
    confidence_threshold: 0.75
    max_facets: 12
    max_description_chars: 300
    allow_llm: true
  coverage:
    version: coverage-v6
    min_support: 0.45
    min_sources: 1
    max_selected_evidence: 12
    max_evidence_chars: 4000
  actions:
    catalog_version: actions-v1
    enabled: [dense, sparse, hybrid, graph, rewrite, decompose, adjust]
    default_top_k: 8
    max_top_k: 20
    max_candidates_per_action: 20
    max_subquestions: 3
    max_graph_hops: 3
  costs:
    version: cost-v1
    retrieval: 0.08
    model: 0.15
    token: 0.00002
    latency: 0.00001
    repeat: 1.0
    minimum_utility: 0.01
  budget:
    retrieval_rounds: 2
    subquestions: 3
    llm_calls: 4
    input_tokens: 16000
    output_tokens: 4000
    candidates: 100
    context_chars: 20000
    latency_ms: 30000
  artifacts:
    cache_root: data/processed/corrective-cache
    run_root: data/processed/corrective-runs
    evaluation_root: data/evaluation/results/corrective-workflow
  max_total_evidence: 100
  max_trace_events: 100

grounded_answer:
  schema_version: v1
  enabled: false
  prompts:
    answer_path: prompts/grounded-answer-v1.txt
    critic_path: prompts/answer-critic-v2.txt
    checker_version: answer-checker-v1
    policy_version: answer-policy-v3
  generation:
    max_selected_evidence: 12
    max_chars_per_evidence: 2000
    max_context_chars: 16000
    max_response_chars: 3000
    max_claims: 30
  critic:
    enabled: true
    max_context_chars: 4000
    max_response_chars: 2000
  web:
    enabled: false
    provider: disabled
    provider_version: disabled-v1
    allowed_domains:
      - arxiv.org
      - openreview.net
      - aclanthology.org
      - proceedings.mlr.press
      - semanticscholar.org
      - openalex.org
      - doi.org
      - github.com
    allowed_source_types: [paper_site, arxiv, academic_database, project_page]
    max_results: 5
    max_excerpt_chars: 2000
    max_context_chars: 8000
    timeout_seconds: 15
    recorded_fixture_path: data/evaluation/fixtures/grounded-web-recorded.json
  budget:
    answer_calls: 2
    critic_calls: 1
    web_calls: 1
    reflection_rounds: 1
    input_tokens: 8800
    output_tokens: 3200
    web_results: 5
    context_chars: 16000
    external_context_chars: 8000
    latency_ms: 30000
  artifacts:
    cache_root: data/processed/grounded-answer-cache
    run_root: data/processed/grounded-answer-runs
    evaluation_root: data/evaluation/results/grounded-answer
  max_trace_events: 100

chunking:
  tokenizer: regex-v1
  target_tokens: 500
  min_tokens: 300
  max_tokens: 700
  overlap_tokens: 75

ingestion:
  limits:
    max_papers: 200
    max_pdf_bytes: 104857600
    max_pages: 500
    min_page_chars: 20
    min_document_chars: 200
  paths:
    raw_root: data/raw
    pilot_manifest: configs/pilot_corpus.json
    pilot_review: configs/pilot_review.json
    interim_root: data/interim
    processed_root: data/processed

parsing:
  full_width_ratio: 0.72
  column_gap_ratio: 0.08
  heading_font_ratio: 1.15
  heading_max_chars: 160

cleaning:
  version: clean-v1
  margin_ratio: 0.10
  repeated_margin_min_pages: 3
  repeated_margin_coverage: 0.60
  remove_adjacent_duplicates: true
