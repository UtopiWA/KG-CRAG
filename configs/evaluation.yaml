dense_rag:
  questions_path: data/evaluation/dense_pilot_questions.json
  results_root: data/evaluation/results/dense-rag
  k_values:
    - 5
    - 10
    - 20
  max_questions: 200

hybrid_retrieval:
  questions_path: data/evaluation/hybrid_dev_questions.json
  results_root: data/evaluation/results/hybrid-retrieval
  strategies:
    - dense
    - sparse
    - rrf
    - weighted
    - fusion_rerank
  k_values:
    - 5
    - 8
    - 10
    - 20
  max_questions: 40
  smoke_questions: 5
  answer_validation_max_configs: 1
  answer_validation_calls_per_question: 1

retrieval_metrics:
  - recall_at_k
  - precision_at_k
  - mrr
  - ndcg_at_k
  - evidence_coverage

answer_metrics:
  - correctness
  - faithfulness
  - answer_relevance
  - citation_precision
  - citation_recall
  - completeness
  - hallucination_rate

agent_metrics:
  - task_success_rate
  - recovery_rate
  - average_retrieval_rounds
  - web_fallback_rate
  - latency
  - tool_calls
