dense_rag:
  questions_path: data/evaluation/dense_pilot_questions.json
  results_root: data/evaluation/results/dense-rag
  k_values:
    - 5
    - 10
    - 20
  max_questions: 200

hybrid_retrieval:
  questions_path: data/evaluation/hybrid_dev_questions.json
  results_root: data/evaluation/results/hybrid-retrieval
  strategies:
    - dense
    - sparse
    - rrf
    - weighted
    - fusion_rerank
  k_values:
    - 5
    - 8
    - 10
    - 20
  max_questions: 40
  smoke_questions: 5
  answer_validation_max_configs: 1
  answer_validation_calls_per_question: 1

retrieval_metrics:
  - recall_at_k
  - precision_at_k
  - mrr
  - ndcg_at_k
  - evidence_coverage

answer_metrics:
  - correctness
  - faithfulness
  - answer_relevance
  - citation_precision
  - citation_recall
  - completeness
  - hallucination_rate

agent_metrics:
  - task_success_rate
  - recovery_rate
  - average_retrieval_rounds
  - web_fallback_rate
  - latency
  - tool_calls

corrective_workflow:
  questions_path: data/evaluation/corrective_dev_questions.json
  results_root: data/evaluation/results/corrective-workflow
  strategies: [fixed_hybrid, type_router, facet_corrective]
  max_questions: 40
  smoke_questions: 5
  online_smoke_questions: 3
  online_max_questions: 20

grounded_answer:
  questions_path: data/evaluation/grounded_answer_dev_questions.json
  results_root: data/evaluation/results/grounded-answer
  fixture_path: data/evaluation/fixtures/grounded-web-recorded.json
  max_questions: 20
  smoke_questions: 5
  online_min_questions: 5
  online_max_questions: 10

unified_evaluation:
  manifest_path: data/evaluation/unified/manifest.json
  results_root: data/evaluation/results/unified
  selection_path: data/evaluation/unified/development-selection.json
  test_lock_root: data/evaluation/results/unified/test-locks
  strategies: [fixed_hybrid, type_router, facet_corrective]
  top_k: 10
  near_duplicate_threshold: 0.92
  max_questions: 80
  max_candidates_per_question: 50
  max_loops_per_question: 2
  max_model_calls: 50
  max_input_tokens: 200000
  max_output_tokens: 50000
  max_latency_ms: 3600000
  max_estimated_cost: 10.0
  max_trace_events: 20000
  online: false
  with_judge: false
  judge_max_answers: 20
  judge_rounds: 1
  judge_models: 1
  seed: 42
